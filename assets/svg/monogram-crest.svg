<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Gilded Cream & Sunset Saffron Gold Gradient -->
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EA" />
      <stop offset="35%" stop-color="#F5DDA9" />
      <stop offset="70%" stop-color="#F2A25F" />
      <stop offset="100%" stop-color="#C97534" />
    </linearGradient>

    <!-- Regal Deep Purple & Mauve Gradient for Wreath & Foliage -->
    <linearGradient id="crestOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A66E98" />
      <stop offset="50%" stop-color="#722E78" />
      <stop offset="100%" stop-color="#4F1C54" />
    </linearGradient>

    <!-- Dusty Rose & Raspberry Petal Gradient -->
    <linearGradient id="lotusPink" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDF4F6" />
      <stop offset="45%" stop-color="#ECD2D6" />
      <stop offset="85%" stop-color="#C4707A" />
      <stop offset="100%" stop-color="#9E4568" />
    </linearGradient>

    <!-- Rich Raspberry into Deep Purple Gradient -->
    <linearGradient id="lotusPinkDeep" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C4707A" />
      <stop offset="60%" stop-color="#9E4568" />
      <stop offset="100%" stop-color="#722E78" />
    </linearGradient>

    <filter id="softShine" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#370E3D" flood-opacity="0.38"/>
    </filter>
  </defs>
  
  <!-- Outer Dotted Rings -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="url(#crestGold)" stroke-width="1.2" stroke-dasharray="3, 4" opacity="0.85" />
  <circle cx="150" cy="150" r="134" fill="none" stroke="url(#crestOlive)" stroke-width="0.8" opacity="0.7" />
  <circle cx="150" cy="150" r="128" fill="none" stroke="url(#crestGold)" stroke-width="0.5" opacity="0.5" />

  <!-- Botanical Laurel Branches in Mauve / Imperial Purple (Left & Right) -->
  <g stroke="url(#crestOlive)" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShine)">
    <!-- Main stem left -->
    <path d="M 150 255 C 80 245 42 185 42 130 C 42 85 82 45 130 36" />
    <!-- Botanical leaves left -->
    <path d="M 50 185 C 36 180 30 165 40 160 C 48 155 56 170 50 185 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 43 155 C 28 150 23 135 33 128 C 43 125 48 142 43 155 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 43 125 C 26 118 24 100 36 95 C 46 93 50 110 43 125 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 52 95 C 38 85 40 68 54 65 C 64 65 62 82 52 95 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 70 70 C 58 58 64 42 78 42 C 88 44 82 60 70 70 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 96 50 C 88 38 98 24 112 26 C 120 30 110 44 96 50 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>

    <!-- Main stem right -->
    <path d="M 150 255 C 220 245 258 185 258 130 C 258 85 218 45 170 36" />
    <!-- Botanical leaves right -->
    <path d="M 250 185 C 264 180 270 165 260 160 C 252 155 244 170 250 185 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 257 155 C 272 150 277 135 267 128 C 257 125 252 142 257 155 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 257 125 C 274 118 276 100 264 95 C 254 93 250 110 257 125 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 248 95 C 262 85 260 68 246 65 C 236 65 238 82 248 95 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 230 70 C 242 58 236 42 222 42 C 212 44 218 60 230 70 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
    <path d="M 204 50 C 212 38 202 24 188 26 C 180 30 190 44 204 50 Z" fill="url(#crestOlive)" fill-opacity="0.45"/>
  </g>

  <!-- Crown Lotus Blossom at the Top (Apex of Crest) -->
  <g transform="translate(150, 42) scale(0.65)" filter="url(#softShine)">
    <!-- Outer Lotus Petals (Left & Right) -->
    <path d="M 0 10 C -25 5, -45 -12, -40 -35 C -30 -30, -15 -10, 0 10 Z" fill="url(#lotusPinkDeep)" stroke="url(#crestGold)" stroke-width="1.2"/>
    <path d="M 0 10 C 25 5, 45 -12, 40 -35 C 30 -30, 15 -10, 0 10 Z" fill="url(#lotusPinkDeep)" stroke="url(#crestGold)" stroke-width="1.2"/>
    <!-- Intermediate Lotus Petals -->
    <path d="M 0 12 C -18 3, -28 -20, -22 -44 C -12 -34, -5 -12, 0 12 Z" fill="url(#lotusPink)" stroke="url(#crestGold)" stroke-width="1.2"/>
    <path d="M 0 12 C 18 3, 28 -20, 22 -44 C 12 -34, 5 -12, 0 12 Z" fill="url(#lotusPink)" stroke="url(#crestGold)" stroke-width="1.2"/>
    <!-- Central Lotus Petal -->
    <path d="M 0 14 C -10 -5, -12 -32, 0 -52 C 12 -32, 10 -5, 0 14 Z" fill="url(#lotusPink)" stroke="url(#crestGold)" stroke-width="1.4"/>
    <!-- Lotus Golden Pod / Stamen -->
    <circle cx="0" cy="8" r="4.5" fill="url(#crestGold)"/>
    <circle cx="-5" cy="4" r="1.5" fill="#F2A25F"/>
    <circle cx="0" cy="2" r="1.5" fill="#F5DDA9"/>
    <circle cx="5" cy="4" r="1.5" fill="#F2A25F"/>
  </g>

  <!-- Monogram Initials "A & K" with Gilded Finish and Lotus Tint -->
  <g filter="url(#softShine)">
    <text x="110" y="166" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="76" font-style="normal" font-weight="400" fill="url(#crestGold)" text-anchor="middle">A</text>
    <text x="150" y="153" font-family="'Pinyon Script', 'Great Vibes', cursive" font-size="44" fill="#9E4568" text-anchor="middle">&amp;</text>
    <text x="190" y="166" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="76" font-style="normal" font-weight="400" fill="url(#crestGold)" text-anchor="middle">K</text>
  </g>

  <!-- Foundation Lotus Blossom at Base -->
  <g transform="translate(150, 246) scale(0.7)" filter="url(#softShine)">
    <!-- Floating Lotus Leaves (Pad) -->
    <path d="M 0 14 C -35 12, -60 5, -55 0 C -45 -4, -20 6, 0 10 C 20 6, 45 -4, 55 0 C 60 5, 35 12, 0 14 Z" fill="url(#crestOlive)" stroke="url(#crestGold)" stroke-width="1"/>
    <!-- Small Blossom Petals -->
    <path d="M 0 10 C -20 5, -30 -10, -25 -22 C -18 -15, -8 -2, 0 10 Z" fill="url(#lotusPinkDeep)" stroke="url(#crestGold)" stroke-width="1"/>
    <path d="M 0 10 C 20 5, 30 -10, 25 -22 C 18 -15, 8 -2, 0 10 Z" fill="url(#lotusPinkDeep)" stroke="url(#crestGold)" stroke-width="1"/>
    <path d="M 0 10 C -12 0, -14 -18, 0 -28 C 14 -18, 12 0, 0 10 Z" fill="url(#lotusPink)" stroke="url(#crestGold)" stroke-width="1.2"/>
    <circle cx="0" cy="6" r="3" fill="url(#crestGold)"/>
  </g>

  <!-- Roman Numeral Date MMXXVI -->
  <text x="150" y="278" font-family="'Montserrat', sans-serif" font-size="10" letter-spacing="4" fill="url(#crestGold)" text-anchor="middle" font-weight="500">MMXXVI</text>
</svg>
